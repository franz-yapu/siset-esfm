# CI de SISET (SDD S0.5). Las acciones van fijadas por SHA (el tag, en el comentario).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'

jobs:
  calidad:
    name: calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Formato
        run: npx prettier --check .
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit de dependencias (altas y críticas)
        run: npm audit --audit-level=high

  base-de-datos:
    name: base-de-datos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: siset
          POSTGRES_PASSWORD: siset_ci
          POSTGRES_DB: siset
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siset -d siset"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Base efímera del runner: no son secretos.
      DATABASE_URL: postgresql://siset:siset_ci@localhost:5432/siset
      DATABASE_URL_TEST: postgresql://siset:siset_ci@localhost:5432/siset_test
      SEED_KARDEX_CI: '9000001'
      SEED_KARDEX_PASSWORD: ci-12345678
      JWT_SECRET: ci-secreto-del-runner-de-32-caracteres-o-mas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migraciones
        run: npm run bd:desplegar -w @siset/api
      - name: Seed
        run: npm run bd:seed -w @siset/api
      - name: Seed otra vez (idempotencia)
        run: npm run bd:seed -w @siset/api
      - name: Tests de base de datos (con cobertura de seguridad ≥ 70 %, SDD S1.14)
        run: npm run test:cobertura -w @siset/api

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # PostgreSQL para el proyecto `api-real`: la web contra la API de verdad (SDD S1.14 §2.4).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: siset
          POSTGRES_PASSWORD: siset_ci
          POSTGRES_DB: siset
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siset -d siset"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Base efímera del runner: no son secretos.
      DATABASE_URL: postgresql://siset:siset_ci@localhost:5432/siset
      SEED_KARDEX_CI: '9000001'
      SEED_KARDEX_PASSWORD: ci-12345678
      JWT_SECRET: ci-secreto-del-runner-de-32-caracteres-o-mas
      E2E_API_REAL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migraciones y seed
        run: npm run bd:desplegar -w @siset/api && npm run bd:seed -w @siset/api
      - name: E2E (Playwright con el Chrome del runner; mock, modo API y API real)
        run: npm run e2e
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Runner efímero: no es un secreto. Lo exige docker compose en todos los pasos (S1.3).
      JWT_SECRET: ci-secreto-del-runner-de-32-caracteres-o-mas
      APP_DB_PASSWORD: ci-rol-app-del-runner-efimero
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Stack completo + prueba de humo
        run: scripts/docker-smoke.sh --mantener
      - name: E2E contra Nginx (Docker)
        run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:8090
      - name: Logs de los contenedores
        if: failure()
        run: COMPOSE_PROJECT_NAME=siset-smoke docker compose --profile completo logs --no-color --tail 200
      - name: Bajar el stack
        if: always()
        run: COMPOSE_PROJECT_NAME=siset-smoke docker compose --profile completo down -v
