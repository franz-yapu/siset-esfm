# Nginx de SISET (SDD S0.4 §2.3): sirve la SPA y hace de proxy de /api hacia la API.
server_tokens off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Detrás de otro proxy (Traefik en staging, SDD S0.9): la IP del cliente viene en X-Forwarded-For
  # cuando la conexión llega desde una red interna. Desde internet nadie llega directo a este Nginx.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;

  client_max_body_size 1m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Las cabeceras de seguridad van en las ubicaciones de la SPA; las respuestas de /api
  # ya traen las de Helmet y no se duplican.

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # La IP real del cliente para la bitácora (la API usa TRUST_PROXY=1).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 30s;
  }

  # Assets con hash en el nombre: caché de un año.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # SPA: toda ruta desconocida devuelve index.html, que nunca se cachea.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
  }
}
