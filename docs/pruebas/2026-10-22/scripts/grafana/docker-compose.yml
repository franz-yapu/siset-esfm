# Grafana + InfluxDB locales para las pruebas de estrés de la SISET (k6).
name: grafana-siset
services:
  influxdb:
    image: influxdb:1.8
    environment: {INFLUXDB_DB: k6, INFLUXDB_HTTP_AUTH_ENABLED: "false"}
    ports: ["127.0.0.1:8086:8086"]
    volumes: [influx:/var/lib/influxdb]
  grafana:
    image: grafana/grafana:11.2.0
    depends_on: [influxdb]
    ports: ["127.0.0.1:3300:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
volumes:
  influx:
